<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login | K. Garden Groove College Buddo</title>

<link rel="icon" href="Badge.jpg">

<link rel="stylesheet" href="login.css">
</head>

<body>

<div class="login-box">

<div class="logo">

<img src="Badge.jpg" alt="School Logo">

</div>

<h2>Admin Login</h2>

<div class="input-box">
<input
type="text"
id="username"
placeholder="Username"
required>
</div>

<div class="input-box">
<input
type="password"
id="password"
placeholder="Password"
required>
</div>

<button type="button" onclick="login()">
Login
</button>

<p id="message"></p>

</div>

<!-- External Login Script -->
<script src="login.js"></script>

</body>
</html>
