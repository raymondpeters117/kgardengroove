<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard | K. Garden Groove College Buddo</title>
<link rel="icon" type="Badge.jpg" href="Badge.jpg">
    <link rel="stylesheet" href="admin.css">

</head>

<body>

<div class="sidebar">

    <h2>Admin Panel</h2>

    <a href="#" id="dashboardLink">Dashboard</a>

<a href="#announcements" id="announcementLink">
Announcements
</a>

<a href="#gallery" id="galleryLink">
Gallery
</a>

<a href="#admissions" id="admissionLink">
Admissions
</a>

<a href="#messages" id="messageLink">
Messages
</a>

<a href="#students" id="studentLink">
Students
</a>

    <button type="button" onclick="logout()">Logout</button>

</div>

<div class="content">

    <h1 id="welcome"></h1>

    <!-- ANNOUNCEMENTS -->
    <section id="announcements">

        <h2>📢 Manage School Announcements</h2>

        <input
            type="text"
            id="announcementTitle"
            placeholder="Announcement Title">

        <textarea
            id="announcementText"
            placeholder="Write announcement here..."></textarea>

        <button
            type="button"
            id="publishBtn"
            onclick="addAnnouncement()">
            Publish Announcement
        </button>

        <div id="announcementList"></div>

    </section>

   <!-- GALLERY -->

<section id="gallery">

<h2>📸 Gallery Management</h2>


<input
type="file"
id="imageUpload"
accept="image/*">


<button type="button" onclick="addImage()">
Add Image
</button>


<div id="galleryList"></div>


</section>
    <!-- ADMISSIONS -->

<section id="admissions">

<h2>📝 Admission Applications</h2>


<div id="applications">

</div>


</section>

    <!-- CONTACT MESSAGES -->
    <section id="messages">

        <h2>📩 Contact Messages</h2>

        <div id="messagesList">
            No messages yet.
        </div>

    </section>

    <!-- STUDENTS -->
    <section id="students">

        <!-- STUDENTS -->

<section id="students">

<h2>🎓 Student Records</h2>


<ul id="studentList"></ul>


</section></div>

<script src="admin.js"></script>

</body>
</html>
